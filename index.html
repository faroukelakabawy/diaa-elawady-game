<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة ماريو الكلاسيكية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container" class="night">

        <div id="celestial-body" class="moon"></div>
        <div id="stars"></div>

        <div id="start-screen" class="overlay-screen">
            <h1>حبايب دين امي اضغط للعب </h1>
            <button id="main-start-btn" onclick="startGame()">إلعب 🎮</button>
        </div>

        <div id="pause-screen" class="overlay-screen hidden">
            <h1>اللعبة متوقفة مؤقتاً ⏸️</h1>
            <button id="resume-btn" onclick="togglePause()">استئناف اللعب ▶️</button>
        </div>

        <div id="win-screen" class="overlay-screen hidden">
            <div class="trophy-icon">🏆</div>
            <h1>كأس حبايب دين امي</h1>
            <p id="win-score">وصلت لـ 100 نقطة بنجاح!</p>
            <button id="win-restart-btn" onclick="startGame()">اللعب مجدداً 🔄</button>
        </div>

        <div id="game-over-screen" class="overlay-screen hidden">
            <h1 id="screen-title">انتهت اللعبة!</h1>
            <p id="final-score"></p>
            <button id="restart-btn" onclick="startGame()">إعادة اللعب 🔄</button>
        </div>

        <div id="hud">
            <div>    نوؤطة: <span id="score">0</span></div>
            <button id="theme-toggle-btn">☀️ نهار</button>
            <button id="pause-btn" onclick="togglePause()">⏸️ إيقاف</button>
            <div>القلوب: <span id="hearts" class="hearts">❤️❤️❤️</span></div>
        </div>

        <div id="player"></div>
    </div>

    <div id="controls-panel">
        <p class="instructions keyboard-only">اضغط <b>Space (مسطرة)</b> للقفز | اضغط <b>P</b> للتوقف المؤقت</p>
        <p class="instructions touch-only">إلمس الشاشة للقفز 👆</p>
        <p id="rotate-hint">لف الموبايل بالعرض لتجربة أفضل 🔄</p>
    </div>

    <audio id="intro-music" src="assets/intro.mp3" preload="auto"></audio>
    <audio id="bg-music" src="bg_sound.mp3" loop></audio>
    <audio id="jump-sound" src="assets/jump.mp3" preload="auto"></audio>
    <audio id="score-sound" src="assets/score.mp3" preload="auto"></audio>
    <audio id="heartloss-sound" src="assets/heartloss.mp3" preload="auto"></audio>
    <audio id="insulin-sound" src="assets/insulin.mp3" preload="auto"></audio>
    <audio id="gameover-sound" src="assets/gameover.mp3" preload="auto"></audio>
    <audio id="win-sound" src="assets/win.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
